# Publishing material-color-utilities from this fork to reposilite.kotlin.website/snapshots.
#
# Triggered by a tag such as `5.0.1-linux.1`, and the tag is the version. A tag rather than a manual
# dispatch because a dispatch needs the workflow on the default branch, and this fork's main tracks
# upstream. The coordinates are io.github.youndie.materialkolor:material-color-utilities-*, never
# com.materialkolor: a consumer that also reads Maven Central must not get two artifacts under one
# name.
name: Publish to reposilite

on:
  push:
    tags:
      - '*-linux.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GROUP: io.github.youndie.materialkolor
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup-java
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The gate before the upload: a version whose tests never ran cannot be taken back.
      - name: Test first
        run: >
          ./gradlew --no-daemon apiCheck :mcu-upstream:test
          :material-color-utilities:jvmTest :material-color-utilities:linuxX64Test

      # Nothing goes over the network yet. The pre-flight and the read-back below walk this copy.
      - name: Produce the publication locally
        run: >
          ./gradlew --no-daemon --no-configuration-cache
          :material-color-utilities:publishAllPublicationsToLocalCopyRepository
          -PGROUP=$GROUP -PVERSION_NAME=$VERSION -PRELEASE_SIGNING_ENABLED=false

      # snapshots answers 409 to an overwrite, so a publish that stops halfway leaves a number that
      # can never be completed. Refuse a taken version before the first PUT, by name.
      - name: Refuse to publish over a version that already exists
        run: |
          taken=0
          for f in $(find build/published -type f \( -name "*-$VERSION.pom" -o -name "*-$VERSION.module" \) | sort); do
            path=${f#build/published/}
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://reposilite.kotlin.website/snapshots/$path")
            [ "$code" = "404" ] && continue
            echo "$code $path"
            taken=1
          done
          [ "$taken" = 0 ] || { echo "::error::$VERSION already has artifacts on the repository"; exit 1; }
          echo "$VERSION is free"

      - name: Publish
        run: >
          ./gradlew --no-daemon --no-configuration-cache
          :material-color-utilities:publishAllPublicationsToWipRepository
          -PGROUP=$GROUP -PVERSION_NAME=$VERSION -PRELEASE_SIGNING_ENABLED=false
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}

      # A green publish task is not a served artifact. Look up every coordinate the build produced.
      - name: Verify the artifacts are served
        run: |
          poms=$(find build/published -name "*-$VERSION.pom" | sort)
          [ -n "$poms" ] || { echo "::error::the publish produced no local copy to verify"; exit 1; }
          echo "$poms" | grep -q "material-color-utilities-linuxx64-$VERSION.pom" \
            || { echo "::error::no linuxx64 publication"; exit 1; }
          fail=0
          for pom in $poms; do
            path=${pom#build/published/}
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://reposilite.kotlin.website/snapshots/$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = 0 ] || { echo "::error::a coordinate was not served after publishing"; exit 1; }
